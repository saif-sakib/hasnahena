# =============================================================================
#  Hasnahena — full local stack (WO-22). Not a production deployment.
# =============================================================================
#      docker compose up --build          the whole platform on :3000
#      docker compose up -d postgres      just the database, for `pnpm dev`
#
#  Base images are digest-pinned (refresh per docs/setup.md).
#
#  DATABASE_URL is hard-coded to the `postgres` service — do NOT change it to
#  ${DATABASE_URL}: `--env-file .env.local` holds the PRODUCTION Neon URL, and
#  the migrate container would seed real member data.
# =============================================================================

name: hasnahena

services:
  postgres:
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    container_name: hasnahena-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hasnahena_dev
    ports:
      - "5432:5432"
    volumes:
      - hasnahena_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: migrate and seed, then exit; the API waits for completion.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    container_name: hasnahena-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hasnahena_dev
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hasnahena.local}
      # Empty, not `:?` — compose interpolates the whole file even for
      # `up -d postgres`. seed.mjs validates the password.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    working_dir: /src
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hasnahena-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hasnahena_dev
      # Matches .env.example. Local only — production secrets live in Render.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-characters-long}
      API_PORT: "8081"
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Unset by default: uploads and email are the two features that degrade
      # cleanly without credentials, and a local stack should not need any.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "8081:8081"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time, not run-time: NEXT_PUBLIC_* is compiled into the browser
        # bundle. Changing these means rebuilding the image, not restarting it.
        NEXT_PUBLIC_API_URL: http://localhost:8081
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: hasnahena-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hasnahena_dev
      # Must be byte-identical to the API's, or every token the Next handlers
      # verify will be rejected. Same default, same variable.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-characters-long}
      # Server-side calls go container-to-container; the browser uses the
      # NEXT_PUBLIC_API_URL baked in above.
      API_URL: http://api:8081
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  hasnahena_postgres_data:
