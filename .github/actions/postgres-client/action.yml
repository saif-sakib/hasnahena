name: PostgreSQL client
description: >
  Installs the newest PostgreSQL client PGDG publishes and puts its real binary
  directory ahead of /usr/bin on PATH for the rest of the job.

# Shared by the nightly Backup and the CI restore drill.

inputs:
  minimum-major:
    description: >
      Fail the step if the resolved client is older than this. Set it to the
      major version of the server being dumped, so a silently-too-old client is
      a red step here instead of a confusing failure later.
    required: false
    default: '17'

runs:
  using: composite
  steps:
    - name: Install the newest PostgreSQL client
      shell: bash
      run: |
        set -euo pipefail

        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc

        add_repo() {
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]" \
               "https://apt.postgresql.org/pub/repos/apt $1-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
        }

        # Fall back to the previous LTS codename when PGDG lags a new ubuntu-latest.
        if ! add_repo "$(lsb_release -cs)"; then
          echo "PGDG has no suite for $(lsb_release -cs); falling back to noble"
          add_repo noble
        fi

        # Newest first — a client can always handle an older server.
        for v in 19 18 17; do
          if sudo apt-get install -y -qq "postgresql-client-$v"; then break; fi
        done

        # pg_wrapper resolves to the runner's configured 16 cluster, so a newer
        # client on disk changes nothing — call the newest bin/ directly.
        newest="$(find /usr/lib/postgresql -maxdepth 2 -name bin -type d 2>/dev/null \
                  | sort -V | tail -1)"
        if [ -z "$newest" ]; then
          echo "::error::no versioned PostgreSQL client directory under /usr/lib/postgresql"
          exit 1
        fi
        echo "$newest" >> "$GITHUB_PATH"
        export PATH="$newest:$PATH"

        major="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
        echo "selected client: $newest (major $major)"
        pg_dump --version
        pg_restore --version
        psql --version

        if [ "$major" -lt "${{ inputs.minimum-major }}" ]; then
          echo "::error::resolved PostgreSQL client is $major, need at least ${{ inputs.minimum-major }}. PGDG may not publish that major yet for this runner image."
          exit 1
        fi
