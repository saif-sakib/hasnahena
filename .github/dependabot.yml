version: 2

# Grouped and monthly on purpose. This is a one-maintainer project; a daily
# stream of individual PRs gets ignored, and an ignored update stream is worse
# than none — it hides the security ones in noise.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Next and React majors are migrations, not updates. Do them deliberately.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Prisma client and CLI must move together; a lone bump breaks generate.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]

  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
