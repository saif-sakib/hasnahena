version: 2

# Application dependencies are NOT tracked here: a month of version-update PRs
# caused two production incidents (a major-bump build break, a lockfile Vercel
# refused). Instead: Dependabot SECURITY updates stay on (a repo setting), CI
# runs `pnpm audit`, and updates are done by hand with `pnpm outdated`
# (docs/setup.md). After merging ANY dependency PR, run `pnpm install` and
# commit pnpm-lock.yaml or Vercel fails.
updates:
  # GitHub Actions only, majors allowed: they touch only CI, and old majors
  # get retired on GitHub's schedule.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
