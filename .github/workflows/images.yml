name: Images

# PKG-06 · both images published to GHCR tagged by commit SHA, for rollback and
# the VPS move (INF-06). Nothing consumes them yet (Vercel and Render build from
# source), so this runs on tags, manual dispatch and a monthly cron — not every
# push. Put it back on `push: branches: [main]` when the VPS move (T-30) lands.

on:
  push:
    tags: ['v*']
  schedule:
    # Monthly: catches a Dockerfile that silently stopped building.
    - cron: '0 2 1 * *'
  workflow_dispatch:

# Same SHA for both images: serialise, never cancel (a half-pushed tag is worse).
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Required to push to GHCR with GITHUB_TOKEN.
      packages: write

    strategy:
      # Do not cancel the API image because the web image failed. They are
      # independent, and knowing whether both are broken is worth 2 minutes.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in repository paths.
      - name: Compute the image name
        id: img
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # The repository root, not the Dockerfile's directory: both images need
          # the pnpm workspace manifest and lockfile, which live at the root.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
            ${{ steps.img.outputs.ref }}:latest
          # NEXT_PUBLIC_* is baked into the client bundle at build time.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.hasnahenafoundation.com' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://hasnahenafoundation.com' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://hasnahenafoundation.com' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

      # A green build is not a running image: prove the entrypoint resolves and
      # the process survives its first seconds.
      - name: Smoke-test the pushed image
        run: |
          set -euo pipefail
          image='${{ steps.img.outputs.ref }}:${{ github.sha }}'
          docker pull -q "$image"

          if [ '${{ matrix.name }}' = 'api' ]; then
            # No database, so it should exit — for the RIGHT reason, not exec/not-found.
            out="$(docker run --rm --entrypoint /server "$image" -healthcheck 2>&1 || true)"
            case "$out" in
              *"exec format error"*|*"no such file"*|*"not found"*)
                echo "::error::the api image's entrypoint is broken: $out"; exit 1 ;;
            esac
            echo "api entrypoint resolves"
          else
            docker run -d --name smoke -p 3000:3000 \
              -e DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/none' "$image"
            ok=
            for _ in $(seq 1 30); do
              # Any HTTP response proves node started and the standalone tree is complete.
              if curl -fsS -o /dev/null http://127.0.0.1:3000/en 2>/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::the web image did not serve /en within 60s"
              docker logs smoke | tail -40
              docker rm -f smoke >/dev/null 2>&1 || true
              exit 1
            fi
            docker rm -f smoke >/dev/null 2>&1 || true
            echo "web image serves /en"
          fi

      # .dockerignore must keep env files out of the image.
      - name: Assert no env files were baked in
        run: |
          set -euo pipefail
          image='${{ steps.img.outputs.ref }}:${{ github.sha }}'
          found="$(docker run --rm --entrypoint='' "$image" \
                     sh -c 'find / -xdev \( -name ".env" -o -name ".env.*" \) ! -name "*.example" 2>/dev/null' \
                   || true)"
          if [ -n "$found" ]; then
            echo "::error::env files are present inside the image:"; echo "$found"; exit 1
          fi
          echo "no env files in the image"
        # The api image is distroless (no shell); the web check covers the shared .dockerignore.
        if: matrix.name == 'web'

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }} image"
            echo
            echo '```'
            echo "docker pull ${{ steps.img.outputs.ref }}:${{ github.sha }}"
            echo '```'
            echo
            echo "Rolling back is pulling an earlier SHA tag — see docs/deployment.md."
          } >> "$GITHUB_STEP_SUMMARY"
