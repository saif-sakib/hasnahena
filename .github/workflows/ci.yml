name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'

jobs:
  # What this commit touched, so docs-only commits skip the four heavy jobs
  # (Actions minutes are metered). `web` always runs — its tests read the docs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backup: ${{ steps.filter.outputs.backup }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits is enough for a push; a PR is compared against its base.
          fetch-depth: 0

      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # No usable base (first push, force-push): run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base commit; running every job"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "backup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"
          echo "$CHANGED"

          # Anything that is not documentation counts as code — including
          # workflow files, scripts and lockfiles.
          if echo "$CHANGED" | grep -qvE '^(docs/|README|CONTRIBUTING|CLAUDE|LICENSE|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only — skipping the Postgres, browser and restore jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # The restore drill only when its inputs change (scripts, schema,
          # migrations) — running it on every push once exhausted Actions minutes
          # and took the nightly backup down. Backup.yml runs it nightly.
          if echo "$CHANGED" | grep -qE '^(scripts/|apps/web/prisma/|\.github/(workflows/(ci|backup)\.yml|actions/postgres-client/))'; then
            echo "backup=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the restore drill covers changed — skipping it"
            echo "backup=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web — typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # `prisma generate` runs on postinstall and needs a URL to parse. It is
      # never connected to — the schema is the only input.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          PRISMA_SKIP_POSTINSTALL_GENERATE: '0'

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # CI-04. Pure lib/ functions; about a second.
      - name: Unit tests
        run: pnpm test:unit

      # Advisories as a visible, non-blocking check (replaces Dependabot version PRs).
      - name: Audit
        run: |
          pnpm audit --audit-level=high || true
          {
            echo "### Dependency audit"
            echo
            echo '```'
            pnpm audit 2>/dev/null | tail -3 || echo "audit unavailable"
            echo '```'
            echo
            echo "Known and accepted: the Next.js and next-intl advisories need"
            echo "a framework migration — Batch G in docs/changelog.md."
          } >> "$GITHUB_STEP_SUMMARY"

  go:
    name: Go — vet, build, unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Formatting
        run: |
          # The whole tree, no exclusions.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # CI-06. errcheck, govet, ineffassign, staticcheck, unused — green, with no
      # nolint suppressions (`unused` catches written-but-never-called code).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.1
          working-directory: apps/api
          # `config verify` fetches its JSON schema from golangci-lint.run on every
          # run; that site timing out failed CI with no code at fault.
          verify: false

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./... -count=1

  integration:
    name: Go — integration tests against Postgres
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hasnahena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasnahena_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # The schema that deploys: migrations, not `db push`.
      - name: Apply schema
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # WO-54: fail if the migrated database differs from schema.prisma (ADR-014).
      - name: Schema drift
        run: pnpm db:migrate:check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # -p 1 is required: packages share one database and truncate it.
      # -race (WO-66) guards the concurrency tests; needs cgo, which the deployed
      # CGO_ENABLED=0 image must never get.
      - name: Integration tests
        working-directory: apps/api
        run: go test ./... -tags=integration -count=1 -p 1 -race

      # TEST-16: every Next route method, against this database (test:unit stays DB-free).
      - name: Next route contract tests
        run: pnpm test:routes
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: test-secret-at-least-thirty-two-characters
          NEXT_PUBLIC_API_URL: http://localhost:8099

      # WO-73: build, then assert the marketing pages were prerendered (only the
      # build knows). Here because prerendering reads the migrated database.
      - name: Build the web app
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: test-secret-at-least-thirty-two-characters
          NEXT_PUBLIC_API_URL: http://localhost:8099
          # resolveSiteOrigin throws on a production build without an origin;
          # localhost, never a real domain.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Marketing pages are prerendered, dashboards are not
        working-directory: apps/web
        run: node scripts/assert-static-routes.mjs

      # WO-83: first-load JS per route vs bundle-budget.json (+10% or unbudgeted fails).
      - name: Client bundles are within budget
        working-directory: apps/web
        run: node scripts/assert-bundle-budget.mjs

  e2e:
    name: Browser — Playwright on a phone viewport
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hasnahena_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasnahena_e2e
      # Obviously fake, and 32+ chars so the API's own length check passes.
      JWT_SECRET: ci-only-secret-at-least-thirty-two-chars
      NEXT_PUBLIC_API_URL: http://localhost:8081
      E2E_BASE_URL: http://localhost:3000
      # The whole suite comes from one address; lift the rate limit.
      RATE_LIMIT_REQUESTS: '100000'
      # The seeded admin (must match the db:seed step) — required, not optional.
      E2E_ADMIN_IDENTIFIER: admin@hasnahena.test
      E2E_ADMIN_PASSWORD: ci-password-1234567
      # No CLOUDINARY_* on purpose (real NID scans): the two real-submission specs skip.

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply schema and seed
        run: |
          pnpm db:migrate
          SEED_ADMIN_EMAIL=admin@hasnahena.test \
          SEED_ADMIN_PASSWORD=ci-password-1234567 \
            pnpm db:seed

      # The browser calls the Go API directly. Built (not `go run`) so a compile
      # error fails here clearly.
      - name: Start the Go API
        working-directory: apps/api
        run: |
          go build -o /tmp/hasnahena-api ./cmd/server
          /tmp/hasnahena-api > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8081/v1/health; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready:"; cat /tmp/api.log; exit 1

      # Chromium only (Pixel 7 emulation).
      - name: Install Playwright browser
        run: pnpm --filter @hasnahena/web exec playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: apps/web
        # playwright.config.ts starts `next dev` itself via `webServer`.
        run: pnpm exec playwright test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report

      # The API log explains whole-suite failures (e.g. `grep -c 429`).
      - name: Upload the API log when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-log
          path: /tmp/api.log
          retention-days: 7

  restore:
    name: Backup and restore drill
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hasnahena_source
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOURCE_URL: postgresql://postgres:postgres@localhost:5432/hasnahena_source
      SCRATCH_URL: postgresql://postgres:postgres@localhost:5432/hasnahena_scratch

    steps:
      - uses: actions/checkout@v7

      # Postgres 17 client to match the service (pg_restore rejects newer archives).
      - uses: ./.github/actions/postgres-client

      # Throwaway credentials minted per run (a literal password trips scanners); masked.
      - name: Mint throwaway credentials for this run
        run: |
          passphrase="$(openssl rand -base64 32)"
          admin_password="$(openssl rand -base64 24)"
          echo "::add-mask::$passphrase"
          echo "::add-mask::$admin_password"
          {
            echo "BACKUP_PASSPHRASE=$passphrase"
            echo "SEED_ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}
          SEED_ADMIN_EMAIL: admin@hasnahena.local
          # SEED_ADMIN_PASSWORD arrives from the mint step via $GITHUB_ENV.

      # An untested backup is a rumour.
      - name: Dump
        run: scripts/backup.sh backups
        env:
          DIRECT_DATABASE_URL: ${{ env.SOURCE_URL }}

      - name: Restore into a scratch database and verify
        run: |
          psql "${SOURCE_URL%/*}/postgres" -c 'CREATE DATABASE hasnahena_scratch;'
          scripts/restore-check.sh "$(ls backups/*.dump.gpg | head -1)" "$SCRATCH_URL"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      # The gitleaks binary (MIT), not the action (licence key under an org).
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks git . --redact --verbose
