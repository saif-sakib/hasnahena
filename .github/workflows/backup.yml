name: Backup

# An encrypted copy of the database and the Cloudinary assets somewhere Neon
# does not control (PITR is bounded and dies with the account).
#
# Required secrets:
#   BACKUP_DATABASE_URL  direct (NOT -pooler) Neon connection string
#   BACKUP_PASSPHRASE    symmetric key for the dump — losing it loses the backup
#   CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET  (assets)
#   BACKUP_S3_BUCKET     e.g. s3://hasnahena-backups — the ONLY copy kept
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION (`auto` for R2)
# Optional:
#   BACKUP_S3_ENDPOINT   set for Backblaze B2 / Cloudflare R2; omit for AWS S3
#
# Nothing is uploaded as a workflow artifact: the repository is public, and a
# public repository's artifacts are downloadable by any signed-in GitHub user.

on:
  schedule:
    # 19:00 UTC = 01:00 Asia/Dhaka — after the working day, before the morning.
    - cron: '0 19 * * *'
    # Monthly copy, kept three times as long.
    - cron: '0 20 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: Dump, encrypt, retain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Fail fast on missing secrets
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          # Without this the job "succeeds" at producing nothing, which is the
          # single worst outcome for a backup pipeline.
          [ -n "$DB" ]     || { echo 'BACKUP_DATABASE_URL secret is not set' >&2; exit 1; }
          [ -n "$PASS" ]   || { echo 'BACKUP_PASSPHRASE secret is not set' >&2; exit 1; }
          [ -n "$BUCKET" ] || { echo 'BACKUP_S3_BUCKET secret is not set' >&2; exit 1; }

      # A pg_dump at least as new as Neon's server (see the action).
      - uses: ./.github/actions/postgres-client

      # Printed before the dump so that if this job ever fails again, the log
      # says which side was wrong instead of only "exit code 1".
      - name: Diagnostics
        env:
          DIRECT_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          echo "runner:   $(lsb_release -ds)"
          echo "client:   $(pg_dump --version)"
          echo "which:    $(command -v pg_dump)"
          echo "gpg:      $(gpg --version | head -1)"
          URL="${DIRECT_DATABASE_URL//-pooler/}"
          server_version="$(psql "$URL" -tAc 'SHOW server_version;' 2>&1 | head -1)"
          echo "server:   $server_version"
          echo "majors:   client=$(pg_dump --version | grep -oE '[0-9]+' | head -1) server=${server_version%%.*}"

      - name: Dump and encrypt
        env:
          DIRECT_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup.sh backups

      - name: Copy to the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          # R2/B2 reject the AWS CLI's default trailing checksums (v2.23+).
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          args=()
          [ -n "$ENDPOINT" ] && args+=(--endpoint-url "$ENDPOINT")
          # Under database/, so a lifecycle rule can treat dumps and assets differently.
          # Only the .gpg files are ever uploaded. backup.sh deletes the plaintext
          # dump, but the filter is explicit so a future edit cannot leak one.
          aws "${args[@]}" s3 cp backups/ "$BUCKET/database/" --recursive --exclude '*' --include '*.dump.gpg'

      - name: Summary
        run: |
          {
            echo "### Backup complete"
            echo
            ls -lh backups/*.dump.gpg | awk '{print "- `" $9 "` — " $5}'
            echo
            echo "Restore with \`scripts/restore-check.sh\` — see docs/deployment.md."
          } >> "$GITHUB_STEP_SUMMARY"

  # Member identity documents live only in Cloudinary. A separate job, so a
  # Cloudinary outage cannot cost the database dump.
  assets:
    name: Copy the Cloudinary assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Fail (never skip) without secrets: a backup that produces nothing must be red.
      - name: Fail fast on missing secrets
        env:
          CLOUD: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          missing=''
          [ -n "$CLOUD" ]  || missing="$missing CLOUDINARY_CLOUD_NAME"
          [ -n "$KEY" ]    || missing="$missing CLOUDINARY_API_KEY"
          [ -n "$SECRET" ] || missing="$missing CLOUDINARY_API_SECRET"
          [ -n "$PASS" ]   || missing="$missing BACKUP_PASSPHRASE"
          [ -n "$BUCKET" ] || missing="$missing BACKUP_S3_BUCKET"
          if [ -n "$missing" ]; then
            echo "Set these repository secrets:$missing" >&2
            echo "Until then, no copy of any member's NID scan exists outside Cloudinary." >&2
            exit 1
          fi

      # No `pnpm install`: the script uses the Admin API over fetch and the
      # node standard library, so it runs from a bare checkout.
      - name: Download and encrypt
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: node apps/web/scripts/cloudinary-backup.mjs backups

      - name: Copy to the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          # R2/B2 reject the AWS CLI's default trailing checksums (v2.23+).
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          args=()
          [ -n "$ENDPOINT" ] && args+=(--endpoint-url "$ENDPOINT")
          aws "${args[@]}" s3 cp backups/ "$BUCKET/assets/" --recursive --exclude '*' --include '*.tar.gz.gpg'

      - name: Summary
        run: |
          {
            echo "### Asset backup complete"
            echo
            ls -lh backups/*.tar.gz.gpg | awk '{print "- `" $9 "` — " $5}'
          } >> "$GITHUB_STEP_SUMMARY"
