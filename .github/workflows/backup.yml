name: Backup

# Neon's own history is not a backup: point-in-time restore is bounded by the
# plan's retention window, and every branch dies with the account. This job puts
# an encrypted copy somewhere Neon does not control.
#
# Required repository secrets:
#   BACKUP_DATABASE_URL  direct (NOT -pooler) Neon connection string
#   BACKUP_PASSPHRASE    symmetric key for the dump — losing it loses the backup
#
# Required for the asset half (members' NID scans, photographs and signatures —
# the database dump contains none of them):
#   CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET
#
# Optional, to also copy off GitHub (recommended once there is real member data):
#   BACKUP_S3_BUCKET     e.g. s3://hasnahena-backups
#   BACKUP_S3_ENDPOINT   set for Backblaze B2 / Cloudflare R2; omit for AWS S3
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION

on:
  schedule:
    # 19:00 UTC = 01:00 Asia/Dhaka — after the working day, before the morning.
    - cron: '0 19 * * *'
    # Monthly copy, kept three times as long.
    - cron: '0 20 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: Dump, encrypt, retain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Fail fast on missing secrets
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Without this the job "succeeds" at producing nothing, which is the
          # single worst outcome for a backup pipeline.
          [ -n "$DB" ]   || { echo 'BACKUP_DATABASE_URL secret is not set' >&2; exit 1; }
          [ -n "$PASS" ] || { echo 'BACKUP_PASSPHRASE secret is not set' >&2; exit 1; }

      # pg_dump refuses to dump a server newer than itself, and Neon upgrades
      # Postgres on its own schedule, so the runner's bundled client is not good
      # enough. Shared with the CI restore drill — see the action for why simply
      # installing a newer client is not sufficient on Debian and Ubuntu.
      - uses: ./.github/actions/postgres-client

      # Printed before the dump so that if this job ever fails again, the log
      # says which side was wrong instead of only "exit code 1".
      - name: Diagnostics
        env:
          DIRECT_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          echo "runner:   $(lsb_release -ds)"
          echo "client:   $(pg_dump --version)"
          echo "which:    $(command -v pg_dump)"
          echo "gpg:      $(gpg --version | head -1)"
          URL="${DIRECT_DATABASE_URL//-pooler/}"
          server_version="$(psql "$URL" -tAc 'SHOW server_version;' 2>&1 | head -1)"
          echo "server:   $server_version"
          echo "majors:   client=$(pg_dump --version | grep -oE '[0-9]+' | head -1) server=${server_version%%.*}"

      - name: Dump and encrypt
        env:
          DIRECT_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup.sh backups

      - name: Name the artifact
        id: meta
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          echo "name=hasnahena-backup-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          # The `secrets` context is not available in `if:` conditions, so the
          # off-GitHub copy is gated on an output instead.
          echo "s3=${BUCKET:+yes}" >> "$GITHUB_OUTPUT"

      # Only the .gpg files are ever uploaded. backup.sh deletes the plaintext
      # dump, but the glob is explicit so a future edit cannot leak one.
      - name: Retain on GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: ${{ github.event.schedule == '0 20 1 * *' && 90 || 30 }}

      - name: Copy off GitHub
        if: steps.meta.outputs.s3 == 'yes'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          # Cloudflare R2 and Backblaze B2 reject the trailing checksums the
          # AWS CLI began sending by default in v2.23, with an error naming
          # neither the checksum nor the CLI. Harmless against real S3, and it
          # saves the hour that failure otherwise costs. R2 also needs
          # AWS_DEFAULT_REGION to be `auto`, which is why that is a secret.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          args=()
          [ -n "$ENDPOINT" ] && args+=(--endpoint-url "$ENDPOINT")
          # Under database/ rather than the bucket root, so a lifecycle rule
          # can keep the tiny dumps for a year and expire the large asset
          # archives far sooner. At the root the two are told apart only by a
          # filename prefix, which is a rule nobody can read at a glance and
          # the wrong one deletes the wrong archive.
          aws "${args[@]}" s3 cp backups/ "$BUCKET/database/" --recursive --exclude '*' --include '*.dump.gpg'

      - name: Summary
        run: |
          {
            echo "### Backup complete"
            echo
            ls -lh backups/*.dump.gpg | awk '{print "- `" $9 "` — " $5}'
            echo
            echo "Restore with \`scripts/restore-check.sh\` — see docs/deployment.md."
          } >> "$GITHUB_STEP_SUMMARY"

  # The database dump covers the database. Every member's identity document
  # lives in Cloudinary, which has no export feature, and losing that account
  # loses regulatory records that cannot be reconstructed from anything —
  # not from the paper passbook, which records money and not photographs.
  #
  # A separate job rather than a step, so that a Cloudinary outage cannot cost
  # us the database dump, and so the two show up independently: "the backup
  # ran" should never mean "half the backup ran".
  assets:
    name: Copy the Cloudinary assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Fails rather than skips, deliberately, and for the same reason the
      # dump job checks its own secrets: a backup job that passes while
      # producing nothing is the worst outcome available to it. If this is red
      # every night, the three secrets below are not set, and members' identity
      # documents have no copy anywhere.
      - name: Fail fast on missing secrets
        env:
          CLOUD: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=''
          [ -n "$CLOUD" ]  || missing="$missing CLOUDINARY_CLOUD_NAME"
          [ -n "$KEY" ]    || missing="$missing CLOUDINARY_API_KEY"
          [ -n "$SECRET" ] || missing="$missing CLOUDINARY_API_SECRET"
          [ -n "$PASS" ]   || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "Set these repository secrets:$missing" >&2
            echo "Until then, no copy of any member's NID scan exists outside Cloudinary." >&2
            exit 1
          fi

      # No `pnpm install`: the script uses the Admin API over fetch and the
      # node standard library, so it runs from a bare checkout.
      - name: Download and encrypt
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: node apps/web/scripts/cloudinary-backup.mjs backups

      - name: Name the artifact
        id: meta
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          echo "name=hasnahena-assets-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          # As in the dump job: the `secrets` context is not available in `if:`.
          echo "s3=${BUCKET:+yes}" >> "$GITHUB_OUTPUT"

      - name: Retain on GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: backups/*.tar.gz.gpg
          if-no-files-found: error
          # A week, not a month. This is the large archive — 4.8 MB a night and
          # growing with the membership — and GitHub Free allows 500 MB of
          # storage shared with the container registry. R2 holds the long tail
          # now, so GitHub only needs to cover the window in which you would
          # notice a problem and reach for yesterday's copy. The monthly run
          # still keeps its 90 days.
          retention-days: ${{ github.event.schedule == '0 20 1 * *' && 90 || 7 }}

      - name: Copy off GitHub
        if: steps.meta.outputs.s3 == 'yes'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          # Cloudflare R2 and Backblaze B2 reject the trailing checksums the
          # AWS CLI began sending by default in v2.23, with an error naming
          # neither the checksum nor the CLI. Harmless against real S3, and it
          # saves the hour that failure otherwise costs. R2 also needs
          # AWS_DEFAULT_REGION to be `auto`, which is why that is a secret.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          args=()
          [ -n "$ENDPOINT" ] && args+=(--endpoint-url "$ENDPOINT")
          aws "${args[@]}" s3 cp backups/ "$BUCKET/assets/" --recursive --exclude '*' --include '*.tar.gz.gpg'

      - name: Summary
        run: |
          {
            echo "### Asset backup complete"
            echo
            ls -lh backups/*.tar.gz.gpg | awk '{print "- `" $9 "` — " $5}'
          } >> "$GITHUB_STEP_SUMMARY"
