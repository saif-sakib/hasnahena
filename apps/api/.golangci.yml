version: "2"

# CI-06. `unused` catches written-but-never-called code that `go vet` misses.

run:
  timeout: 5m
  # Integration tests live behind this tag; lint them too.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  # All five green (WO-40): a new finding is a new defect, not a suppression.

  settings:
    errcheck:
      exclude-functions:
        # A rollback after a successful commit legitimately errors, and the
        # deferred form has nowhere to report to.
        - (github.com/jackc/pgx/v5.Tx).Rollback
        # Deferred closes on read paths.
        - (io.Closer).Close
        # crypto/rand.Read cannot fail since Go 1.24. Scoped by package: on
        # math/rand this would hide predictable tokens.
        - crypto/rand.Read

  exclusions:
    rules:
      # A failed cleanup in a test surfaces as the next test failing, which is
      # loud enough.
      - path: _test\.go
        linters:
          - errcheck

issues:
  # Report everything rather than the default cap of 3 per linter. A truncated
  # list is how the second instance of a defect gets missed.
  max-issues-per-linter: 0
  max-same-issues: 0
