title = "Hasnahena secret scanning"

# Extend gitleaks' full default ruleset; only subtract from it.
[extend]
useDefault = true

# `[[allowlists]]`, not the deprecated `[allowlist]` (mixing them fails to load).

[[allowlists]]
description = "Documentation placeholders, which are not secrets"

# Match against the whole line rather than the extracted secret, so the
# surrounding `KEY=<...>` shape is visible to the pattern.
regexTarget = "line"

regexes = [
  # `=<placeholder prose>` — this repo's placeholder convention in docs and
  # .env examples. A real secret is never wrapped in angle brackets.
  '''=\s*<[^>]+>''',
  # `…=…` inside a fenced example that points at localhost.
  '''postgresql://postgres:postgres@(localhost|127\.0\.0\.1)''',
]

paths = [
  # Deleted doc, still in history; rewriting history would be worse.
  '''docs/DEPLOYMENT_FREE_HOSTING\.md''',
]

# A JWT-shaped literal in a Go test (commit 1c9b307), long since replaced by a
# minted token. Scoped to the exact line — no `paths`: a global allowlist's
# paths skip the whole file even with condition = "AND".
[[allowlists]]
description = "Fake JWT in auth_gate_integration_test.go: payload is {} and the signature is the word 'sig'"
regexTarget = "line"
regexes = ['''\{"token with no scheme", "eyJhbGciOiJIUzI1NiJ9\.e30\.sig"\},''']

# A 64-char hex test fixture (commit 0c08ca8), now composed with strings.Repeat.
# Scoped to the exact line, like the entry above.
[[allowlists]]
description = "Hex fixture in auth_security_integration_test.go, replaced in the working tree by strings.Repeat"
regexTarget = "line"
regexes = ['''const secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"''']
